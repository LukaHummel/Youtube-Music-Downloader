[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmusic-jellyfin-bot"
version = "0.1.0"
description = "Telegram-driven YouTube Music ingestor for Jellyfin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beets>=2.5,<3",
  "python-telegram-bot>=22,<23",
  "yt-dlp>=2026.3.17",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ytmusic_jellyfin_bot = ["config/*.yaml", "config/*.conf"]
